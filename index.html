<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Astro Pedro - Aventura na Lua</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="game">
    <!-- Background + parallax -->
    <div id="stars"></div>
    <div id="planet"></div>
    <div id="planet2"></div>

    <!-- HUD: contador de itens e timer -->
    <div id="hud"><span class="gem-icon"></span> x <span id="score">0</span> - TEMPO: <span id="time">60</span></div>

    <!-- Elementos do jogo -->
    <div id="item" class="gem"></div>
    <div id="obstacle"></div>
    <div id="player"><div class="visor"></div><div class="pack"></div></div>
    <div id="ground"></div>

    <!-- Tela inicial -->
    <section id="startScreen" class="overlay">
      <h1>ASTRO PEDRO</h1>
      <p>Colete os cristais, pule as rochas lunares e sobreviva por 60 segundos!</p>
      <p class="hint">PULAR: Espaço / Seta para cima / toque na tela</p>
      <button id="startBtn">JOGAR</button>
    </section>

    <!-- Letreiro de Game Over + botão reiniciar -->
    <section id="gameOver" class="overlay hidden">
      <h2 id="goTitle">GAME OVER</h2>
      <p id="goMsg"></p>
      <button id="restartBtn">REINICIAR</button>
    </section>
  </main>
  <script src="game.js"></script>
</body>
</html>
